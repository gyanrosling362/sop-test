function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function fmtTime(sec){
  const m = Math.floor(sec/60).toString().padStart(2,"0");
  const s = Math.floor(sec%60).toString().padStart(2,"0");
  return m+":"+s;
}
function fmtRemaining(ms){
  const h = Math.floor(ms/3600000);
  const m = Math.floor((ms%3600000)/60000);
  return h+" год " + m + " хв";
}
function fmtDate(ts){
  if(!ts) return "—";
  const d = new Date(ts);
  return d.toLocaleString("uk-UA");
}

function submitToGoogleForm(payload){
  // Одна, найнадійніша відправка: fetch без iframe.
  // Iframe-метод прибрано — fetch стабільніше й простіше, дублювання рядків більше не потрібне.
  const params = new URLSearchParams();
  Object.keys(payload).forEach(name => params.append(name, payload[name]));

  return fetch(FORM_ACTION_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: params.toString()
  });
}

function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field+='"'; i++; } else { inQuotes = false; }
      } else field += c;
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field=""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ /* пропускаємо */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function parseTimestamp(str){
  str = (str||"").trim();
  let d = new Date(str);
  if(!isNaN(d.getTime())) return d.getTime();
  const m = str.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})[,\s]+(\d{1,2}):(\d{2})(:(\d{2}))?/);
  if(m){
    const eu = str.indexOf('.') !== -1;
    let day, month;
    if(eu){ day=+m[1]; month=+m[2]; } else { month=+m[1]; day=+m[2]; }
    let year = +m[3]; if(year < 100) year += 2000;
    const hh=+m[4], mm=+m[5], ss = m[7]?+m[7]:0;
    d = new Date(year, month-1, day, hh, mm, ss);
    if(!isNaN(d.getTime())) return d.getTime();
  }
  return 0;
}

async function fetchAttempts(){
  const controller = new AbortController();
  const timeoutId = setTimeout(()=> controller.abort(), 8000); // не чекаємо довше 8 секунд
  let res;
  try{
    res = await fetch(CSV_URL + (CSV_URL.includes("?") ? "&" : "?") + "_ts=" + Date.now(), { cache: "no-store", signal: controller.signal });
  } finally {
    clearTimeout(timeoutId);
  }
  const text = await res.text();
  const rows = parseCSV(text);
  const out = [];
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r || r.length < 2 || !r[1]) continue;
    out.push({
      ts: parseTimestamp(r[0]),
      email: (r[1]||"").trim().toLowerCase(),
      callsign: (r[2]||"").trim(),
      posada: (r[3]||"").trim(),
      general: (r[4]||"").trim(),
      profile: (r[5]||"").trim(),
      situational: (r[6]||"").trim(),
      result: (r[7]||"").trim()
    });
  }
  return out;
}

async function fetchDeadline(){
  const controller = new AbortController();
  const timeoutId = setTimeout(()=> controller.abort(), 8000);
  let res;
  try{
    res = await fetch(DEADLINE_CSV_URL + "&_ts=" + Date.now(), { cache: "no-store", signal: controller.signal });
  } finally {
    clearTimeout(timeoutId);
  }
  const text = await res.text();
  const rows = parseCSV(text);
  let last = null;
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r || r.length < 2 || !r[1]) continue;
    const ts = parseTimestamp(r[0]);
    if(!last || ts > last.ts) last = { ts, value: r[1].trim() };
  }
  if(!last) return null;
  const d = new Date(last.value);
  if(isNaN(d.getTime())) return null;
  return d.getTime();
}

function resetViewportForTransition(){

function initGoogleSignIn(){

}

function decodeJWT(token){
  const base64Url = token.split(".")[1];
  const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
  const jsonPayload = decodeURIComponent(
    atob(base64).split("").map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join("")
  );
  return JSON.parse(jsonPayload);
}

function handleGoogleCredential(response){
  try{
    const payload = decodeJWT(response.credential);
    if(payload && payload.email){
      state.email = payload.email.trim().toLowerCase();
      renderStart();
    } else {
      renderStart("Не вдалося отримати пошту з Google-акаунту.");
    }
  }catch(e){
    renderStart("Не вдалося обробити вхід через Google. Спробуй ще раз.");
  }
}

async function loadDeadlineInfo(){
  const el = document.getElementById("deadlineInfo");
  if(!el) return;
  try{
    const deadlineTs = await fetchDeadline();
    const el2 = document.getElementById("deadlineInfo"); // могли встигнути перейти на інший екран
    if(!el2) return;
    if(deadlineTs){
      const isPast = Date.now() > deadlineTs;
      el2.innerHTML = `<div class="notice" style="${isPast ? 'border-left-color:var(--status-bad-text)' : ''}">Прийом відповідей ${isPast ? 'завершено' : 'до'}: <b>${fmtDate(deadlineTs)}</b></div>`;
    }
  }catch(e){ /* якщо не вдалось завантажити — просто нічого не показуємо */ }
}

function resultBadgeClass(result){
  if(result === "СКЛАВ") return "good";
  if(result === "НЕ СКЛАВ") return "bad";
  return "mid";
}

/* --- екран "вже пройдено": показує останній результат, блокування ПОСТІЙНЕ --- */
function renderAlreadyTaken(email, callsign, last){
  timerEl.classList.add("hidden");
  card.innerHTML = `
    <h1 style="text-align:center">Тест уже пройдено</h1>
  `;
}

/* --- екран "тест закрито": дедлайн уже минув --- */
function renderClosed(deadlineTs){
  timerEl.classList.add("hidden");
  card.innerHTML = `
    <h1 style="text-align:center">Тест закрито</h1>
    <p class="sub" style="text-align:center">Прийом відповідей завершено ${fmtDate(deadlineTs)}. Зверніться до відповідальної особи, якщо вважаєте це помилкою.</p>
  `;
}

async function onStartClick(){
  const email = isAdminMode ? ADMIN_EMAIL : state.email;
  const callsign = document.getElementById("callsign").value.trim();
  const posada = document.getElementById("posada").value;
  if(!email || !email.includes("@")){ renderStart("Спочатку увійди через Google."); return; }
  if(!callsign){ renderStart("Вкажи позивний."); return; }
  if(!posada){ renderStart("Обери посаду зі списку."); return; }

  state.email = email;
  state.callsign = callsign;
  state.posada = posada;

  const startBtn = document.getElementById("startBtn");
  startBtn.disabled = true;
  startBtn.textContent = "Перевірка…";

  try{
    const [attempts, deadlineTs] = await Promise.all([
      fetchAttempts(),
      isAdminMode ? Promise.resolve(null) : fetchDeadline()
    ]);

    if(!isAdminMode){
      // Перевірка дедлайну
      if(deadlineTs && Date.now() > deadlineTs){
        renderClosed(deadlineTs);
        return;
      }
    }

    if(!isAdminMode && email !== ADMIN_EMAIL){
      let last = null;
      attempts.forEach(a=>{ if(a.email === email && (!last || a.ts > last.ts)) last = a; });
      if(last){
        renderAlreadyTaken(email, callsign, last);
        return;
      }
    }
  }catch(e){
    renderStart("Не вдалося перевірити доступність тесту (проблема з мережею чи посиланням на таблицю). Спробуй ще раз за хвилину.");
    return;
  }

  resetViewportForTransition();
  startQuiz();
}

/* ============================================================
   ТЕСТ
   ============================================================ */
function buildQuestion(raw){
  const optionOrder = shuffle(raw[1].map((text,i)=>({text,orig:i})));
  return {
    text: raw[0],
    options: optionOrder.map(o=>o.text),
    correctIndex: optionOrder.findIndex(o=>o.orig === raw[2]),
    situational: !!raw[3]
  };
}

function startQuiz(){
  const generalPicked = shuffle(GENERAL_POOL).slice(0, GENERAL_COUNT).map(q => Object.assign(buildQuestion(q), {section:"general"}));
  const profilePool = PROFILE_POOLS[state.posada] || [];
  const profilePicked = shuffle(profilePool).slice(0, PROFILE_COUNT).map(q => Object.assign(buildQuestion(q), {section:"profile"}));

  state.quiz = generalPicked.concat(profilePicked);
  state.current = 0;
  state.answers = new Array(state.quiz.length).fill(null);
  state.startTs = Date.now();
  state.finished = false;
  saveProgress();

  timerEl.classList.remove("hidden");
  startTimer();
  renderQuestion();
}

function tick(){
  const elapsed = Math.floor((Date.now() - state.startTs)/1000);
  state.timeLeft = TIME_LIMIT_SECONDS - elapsed;
  updateTimerDisplay();
  if(state.timeLeft <= 0){
    clearInterval(state.timerId);
    finishQuiz();
  }
}
function startTimer(){
  clearInterval(state.timerId);
  tick();
  state.timerId = setInterval(tick, 1000);
}
function updateTimerDisplay(){
  timerEl.textContent = fmtTime(Math.max(0,state.timeLeft));
  timerEl.classList.toggle("warn", state.timeLeft <= 60);
}

function renderQuestion(){
  const q = state.quiz[state.current];
  const isLast = state.current === state.quiz.length - 1;
  const sectionLabel = q.section === "general" ? "Загальна частина" : "Профільна частина — " + state.posada;
  card.innerHTML = `
    <div class="progress">${sectionLabel} · ПИТАННЯ ${state.current+1} / ${state.quiz.length}</div>
    <div class="qtext">${q.text}</div>
    <div class="options" id="opts"></div>
    <button class="btn-primary" id="nextBtn" disabled>${isLast ? "Завершити тест" : "Далі"}</button>
  `;
  const optsEl = document.getElementById("opts");
  q.options.forEach((opt, idx)=>{
    const row = document.createElement("label");
    row.className = "opt" + (isAdminMode && idx === q.correctIndex ? " correct-answer" : "");
    row.innerHTML = `<input type="radio" name="opt" value="${idx}"/><span>${opt}</span>${isAdminMode && idx === q.correctIndex ? ' <span style="color:var(--status-good-text);font-weight:700;margin-left:6px">✓</span>' : ''}`;
    row.onclick = ()=>{
      document.querySelectorAll(".opt").forEach(o=>o.classList.remove("selected"));
      row.classList.add("selected");
      document.getElementById("nextBtn").disabled = false;
      state._pendingChoice = idx;
    };
    optsEl.appendChild(row);
  });
  document.getElementById("nextBtn").onclick = ()=>{
    state.answers[state.current] = state._pendingChoice;
    state._pendingChoice = undefined;
    if(state.current < state.quiz.length - 1){
      state.current++;
      saveProgress();
      renderQuestion();
    } else {
      clearInterval(state.timerId);
      finishQuiz();
    }
  };
}

async function finishQuiz(){
  if(state.finished) return;
  state.finished = true;
  timerEl.classList.add("hidden");
  clearProgress();

  let generalCorrect = 0, generalTotal = 0;
  let profileCorrect = 0, profileTotal = 0;
  let situationalCorrect = 0, situationalTotal = 0;

  state.quiz.forEach((q,i)=>{
    const isRight = state.answers[i] === q.correctIndex;
    if(q.section === "general"){
      generalTotal++;
      if(isRight) generalCorrect++;
    } else {
      profileTotal++;
      if(isRight) profileCorrect++;
      if(q.situational){
        situationalTotal++;
        if(isRight) situationalCorrect++;
      }
    }
  });

  const generalErrors = generalTotal - generalCorrect;
  const profileErrors = profileTotal - profileCorrect;
  const passedGreen = generalErrors === 0 && profileErrors === 0;
  const passedYellow = generalErrors <= PASS_THRESHOLD_GENERAL_ERR && profileErrors <= PASS_THRESHOLD_PROFILE_ERR;
  const result = passedGreen ? "СКЛАВ" : (passedYellow ? "СКЛАВ ІЗ ЗАУВАЖЕННЯМИ" : "НЕ СКЛАВ");

  const detailsLines = state.quiz.map((q,i)=>{
    const chosenIdx = state.answers[i];
    const chosenText = (chosenIdx === null || chosenIdx === undefined) ? "(не відповів)" : q.options[chosenIdx];
    const correctText = q.options[q.correctIndex];
    const isRight = chosenIdx === q.correctIndex;
    const sectionLabel = q.section === "general" ? "Загальна" : "Профільна";
    return `${i+1}. [${sectionLabel}] ${q.text}\nОбрано: ${chosenText}\nПравильно: ${correctText}\nРезультат: ${isRight ? "вірно" : "невірно"}`;
  }).join("\n\n");

  const payload = {
    [ENTRY_EMAIL]: state.email,
    [ENTRY_CALLSIGN]: state.callsign,
    [ENTRY_POSADA]: state.posada,
    [ENTRY_GENERAL]: generalCorrect + "/" + generalTotal,
    [ENTRY_PROFILE]: profileCorrect + "/" + profileTotal,
    [ENTRY_SITUATIONAL]: situationalCorrect + "/" + situationalTotal,
    [ENTRY_RESULT]: result,
    [ENTRY_DETAILS]: detailsLines
  };

  card.innerHTML = `
    <div class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><path d="M5 12l5 5L20 7"/></svg></div>
    <h1>Тест завершено</h1>
    <p class="sub">Зберігаємо відповіді…</p>
  `;

  try{
    await submitToGoogleForm(payload);
  }catch(e){ /* навіть якщо не вдалось — все одно показуємо результат */ }

  const badgeCls = resultBadgeClass(result);
  card.innerHTML = `
    <h1 style="text-align:center">${isAdminMode ? "Результат" : "Відповіді прийнято"}</h1>
    ${isAdminMode ? `
      <div class="result-badge ${badgeCls}">${result}</div>
      <div class="result-breakdown">
        <div><div class="num">${generalCorrect}/${generalTotal}</div><div class="lbl">Загальний</div></div>
        <div><div class="num">${profileCorrect}/${profileTotal}</div><div class="lbl">Профільний</div></div>
        <div><div class="num">${situationalCorrect}/${situationalTotal}</div><div class="lbl">Ситуаційні</div></div>
      </div>
    ` : `<p class="sub" style="text-align:center">Результат підлягає перевірці відповідальною особою.</p>`}
    <div class="meta-line" style="text-align:center">Пошта: <b>${state.email}</b></div>
    <div class="meta-line" style="text-align:center">Позивний: <b>${state.callsign}</b></div>
    <div class="meta-line" style="text-align:center">Посада: <b>${state.posada}</b></div>
    <button class="btn-primary" id="restartBtn" style="margin-top:18px">До початку</button>
  `;
  document.getElementById("restartBtn").onclick = ()=>{
    state = { email:"", callsign:"", posada:"", quiz:[], current:0, answers:[], timeLeft:TIME_LIMIT_SECONDS, timerId:null, finished:false, startTs:0 };
    renderStart();
  };
}

/* ============================================================
   СТАРТ: перевіряємо, чи є незавершений тест у цьому браузері
   ============================================================ */
function renderPasswordGate(errorMsg){
  timerEl.classList.add("hidden");
  card.innerHTML = `
    <div style="text-align:center">
      <div class="icon-circle" style="margin-left:auto;margin-right:auto">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10" width="16" height="10" rx="2"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>
      </div>
      <h1>Доступ обмежено</h1>
      <p class="sub">Введи код доступу, щоб відкрити тест</p>
    </div>
    <input type="password" id="pageCode" placeholder="Код доступу" style="text-align:center;letter-spacing:.08em;font-size:17px"/>
    ${errorMsg ? `<div class="error" style="text-align:center">${errorMsg}</div>` : ""}
    <button class="btn-primary" id="unlockBtn">Увійти</button>
  `;
  const submit = ()=>{
    const val = document.getElementById("pageCode").value;
    resetViewportForTransition();
    if(val === ADMIN_PASSWORD){
      try{ sessionStorage.setItem("sop_unlocked", "1"); sessionStorage.setItem("sop_admin", "1"); }catch(e){}
      isAdminMode = true;
      startApp();
    } else if(val === PAGE_PASSWORD){
      try{ sessionStorage.setItem("sop_unlocked", "1"); sessionStorage.removeItem("sop_admin"); }catch(e){}
      isAdminMode = false;
      startApp();
    } else {
      renderPasswordGate("Невірний код доступу.");
    }
  };
  document.getElementById("unlockBtn").onclick = submit;
  document.getElementById("pageCode").addEventListener("keydown", (e)=>{ if(e.key === "Enter") submit(); });
}

function startApp(){
  const saved = loadProgress();
  if(saved && saved.quiz && saved.quiz.length && saved.startTs){
    state.email = saved.email;
    state.callsign = saved.callsign;
    state.posada = saved.posada;
    state.quiz = saved.quiz;
    state.answers = saved.answers;
    state.current = saved.current;
    state.startTs = saved.startTs;
    state.finished = false;
    const elapsed = Date.now() - saved.startTs;
    timerEl.classList.remove("hidden");
    if(elapsed >= TIME_LIMIT_SECONDS * 1000){
      finishQuiz();
    } else {
      startTimer();
      renderQuestion();
    }
  } else if(isAdminMode){
    renderAdminPanel();
  } else {
    renderStart();
  }
}

/* ============================================================
   АДМІН-ПАНЕЛЬ: встановлення дедлайну проходження тесту
   ============================================================ */
function toDatetimeLocal(ts){
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

async function saveDeadline(value){
  const params = new URLSearchParams();
  params.append(ENTRY_DEADLINE, value);
  try{
    await fetch(DEADLINE_FORM_ACTION_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: params.toString()
    });
  }catch(e){}
}

async function renderAdminPanel(errorMsg, savedMsg){
  timerEl.classList.add("hidden");
  card.innerHTML = `
    <h1 style="text-align:center">Адмін-панель</h1>
    <p class="sub" style="text-align:center">Завантаження поточного дедлайну…</p>
  `;
  let deadlineTs = null;
  try{
    deadlineTs = await fetchDeadline();
  }catch(e){}

  const currentText = deadlineTs ? fmtDate(deadlineTs) : "не встановлено (тест завжди відкритий)";
  const inputVal = deadlineTs ? toDatetimeLocal(deadlineTs) : "";

  card.innerHTML = `
    <h1 style="text-align:center">Адмін-панель</h1>
    <p class="sub" style="text-align:center">Поточний дедлайн: <b style="color:var(--text-primary)">${currentText}</b></p>
    <label for="deadlineInput">Новий дедлайн (дата й час)</label>
    <input type="datetime-local" id="deadlineInput" value="${inputVal}"/>
    ${errorMsg ? `<div class="error">${errorMsg}</div>` : ""}
    ${savedMsg ? `<p class="sub" style="color:var(--status-good-text);text-align:center">${savedMsg}</p>` : ""}
    <button class="btn-primary" id="saveDeadlineBtn">Зберегти дедлайн</button>
    <button class="btn-ghost" id="clearDeadlineBtn" style="width:100%;margin-top:10px">Прибрати дедлайн (тест завжди відкритий)</button>
    <button class="btn-ghost" id="takeAsAdminBtn" style="width:100%;margin-top:10px">Пройти тест як адмін</button>
    <button class="btn-ghost" id="logoutBtn" style="width:100%;margin-top:10px">← Вийти / ввести інший код</button>
  `;
  document.getElementById("logoutBtn").onclick = ()=>{
    try{ sessionStorage.removeItem("sop_unlocked"); sessionStorage.removeItem("sop_admin"); }catch(e){}
    isAdminMode = false;
    renderPasswordGate();
  };
  document.getElementById("saveDeadlineBtn").onclick = async ()=>{
    const val = document.getElementById("deadlineInput").value;
    if(!val){ renderAdminPanel("Обери дату й час."); return; }
    const ts = new Date(val).getTime();
    if(isNaN(ts)){ renderAdminPanel("Некоректна дата."); return; }
    const btn = document.getElementById("saveDeadlineBtn");
    btn.disabled = true; btn.textContent = "Зберігаємо…";
    await saveDeadline(new Date(val).toISOString());
    renderAdminPanel(null, "Дедлайн збережено.");
  };
  document.getElementById("clearDeadlineBtn").onclick = async ()=>{
    const btn = document.getElementById("clearDeadlineBtn");
    btn.disabled = true; btn.textContent = "Зберігаємо…";
    await saveDeadline("NONE");
    renderAdminPanel(null, "Дедлайн знято, тест завжди відкритий.");
  };
  document.getElementById("takeAsAdminBtn").onclick = ()=> renderStart();
}

let isAdminMode = false;

(function initGate(){
  let unlocked = false;
  try{
    unlocked = sessionStorage.getItem("sop_unlocked") === "1";
    isAdminMode = sessionStorage.getItem("sop_admin") === "1";
  }catch(e){}
  if(unlocked){ startApp(); } else { renderPasswordGate(); }
})();
</script>
