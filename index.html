<html lang="uk">
<head>
<meta charset="utf-8" />

<title>Тест «Управління боєм»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --page-bg: #0e0d0c;
    --card-bg: #171513;

    --border-color: #262320;
    --text-primary: #d8d3c6;
    --text-heading: #f4efe4;
    --muted-text: #8a8576;
    --accent: #ff6a26;
    --accent-dim: #ff6a2626;

    --status-bad-bg: #4a1e14;
    --status-bad-text: #ffb199;
    --input-bg: #171513;
    --input-border: #2c2925;

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body{

    background: var(--page-bg);
    color: var(--text-primary);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    align-items:center;
    justify-content:center;
    padding: 24px;

  .topbar .title{
    font-family: 'Oswald', 'Inter', sans-serif;
    font-size: 1.3rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
    color: var(--text-heading);
  }
  .topbar .title span{ color: var(--accent); }

  .timer.warn{ color: var(--status-bad-text); }

    width:100%; background: var(--input-bg); border: 1px solid var(--input-border); color: var(--input-text);

  button{
    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; cursor:pointer;
    border-radius: 4px; border: none; padding: 12px 20px;
  }
  .btn-primary{ background: var(--accent); color: #1a1008; width:100%; }
  .btn-primary:disabled{ background: #4a3728; color: #8a7a6a; cursor: not-allowed; }
  .btn-primary:hover:not(:disabled){ background: #ff7d40; }
  .btn-ghost{ background: transparent; color: var(--muted-text); border: 1px solid var(--border-color); font-size: 12px; padding: 6px 10px; }
  .btn-ghost:hover{ color: var(--text-primary); border-color: var(--muted-text); }
  .error{ color: var(--status-bad-text); font-size: 13px; margin: -6px 0 14px; }
  .progress{ font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; color: var(--muted-text); margin-bottom: 10px; letter-spacing: .03em; }
  .qtext{ font-size: 17px; line-height: 1.5; margin: 0 0 20px; color: var(--text-heading); }
  .options{ display:flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
  .opt{
    display:flex; align-items:flex-start; gap: 12px; padding: 13px 14px;
    background: var(--card-bg-2); border: 1px solid var(--border-color); border-radius: 4px; cursor:pointer;
  }
  .opt:hover{ border-color: var(--accent); }
  .opt.selected{ border-color: var(--accent); background: var(--accent-dim); }
  .opt.correct-answer{ border-color: var(--status-good-text); background: rgba(134,239,172,0.08); }
  .opt.correct-answer.selected{ border-color: var(--status-good-text); background: rgba(134,239,172,0.16); }
  .opt input{ margin-top: 2px; accent-color: var(--accent); }
  .opt span{ font-size: 15px; line-height:1.4; }
  .meta-line{ color: var(--muted-text); font-size: 13px; margin-bottom: 4px; }
  .meta-line b{ color: var(--text-primary); font-weight: 600; }
  .result-score{ font-family: 'Oswald', sans-serif; font-size: 44px; font-weight: 700; color: var(--accent); margin: 6px 0 4px; text-align:center; }
  .result-badge{ display:block; text-align:center; margin: 0 auto 18px; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; width: fit-content; }
  .result-badge.good{ background: var(--status-good-bg); color: var(--status-good-text); }
  .result-badge.mid{ background: #4a3410; color: #f5c463; }
  .result-badge.bad{ background: var(--status-bad-bg); color: var(--status-bad-text); }
  .result-breakdown{ display:flex; justify-content:center; gap: 22px; margin-bottom: 20px; }
  .result-breakdown div{ text-align:center; }
  .result-breakdown .num{ font-family:'Oswald',sans-serif; font-size:20px; font-weight:700; color:var(--text-heading); }
  .result-breakdown .lbl{ font-size:11px; color:var(--muted-text); text-transform:uppercase; letter-spacing:.04em; margin-top:2px; }
  .icon-circle{ width: 56px; height: 56px; border-radius: 50%; background: var(--card-bg-2); border: 1px solid var(--border-color); display:flex; align-items:center; justify-content:center; margin-bottom: 18px; }
  .icon-circle svg{ width: 26px; height: 26px; }
  .hidden{ display:none; }
</style>
</head>

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function fmtTime(sec){
  const m = Math.floor(sec/60).toString().padStart(2,"0");
  const s = Math.floor(sec%60).toString().padStart(2,"0");
  return m+":"+s;
}
function fmtRemaining(ms){
  const h = Math.floor(ms/3600000);
  const m = Math.floor((ms%3600000)/60000);
  return h+" год " + m + " хв";
}

function submitToGoogleForm(payload){
  // Відправляємо ДВОМА способами одночасно (для надійності):
  // 1) fetch без iframe — краще працює у вбудованих браузерах месенджерів (WhatsApp, Telegram тощо)
  // 2) прихований iframe — запасний варіант для середовищ, де fetch на інший домен обмежено
  const params = new URLSearchParams();
  Object.keys(payload).forEach(name => params.append(name, payload[name]));

  const fetchAttempt = fetch(FORM_ACTION_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: params.toString()
  }).catch(()=>{});

  const iframeAttempt = new Promise((resolve)=>{
    const iframeName = "hidden_submit_frame";
    let iframe = document.getElementById(iframeName);
    if(!iframe){
      iframe = document.createElement("iframe");
      iframe.name = iframeName;
      iframe.id = iframeName;
      iframe.style.display = "none";
      document.body.appendChild(iframe);
    }
    const form = document.createElement("form");
    form.action = FORM_ACTION_URL;
    form.method = "POST";
    form.target = iframeName;
    Object.keys(payload).forEach(name=>{
      const input = document.createElement("input");
      input.type = "hidden";
      input.name = name;
      input.value = payload[name];
      form.appendChild(input);
    });
    document.body.appendChild(form);
    try{ form.submit(); }catch(e){}
    setTimeout(()=>{ form.remove(); resolve(); }, 900);
  });

  return Promise.all([fetchAttempt, iframeAttempt]);
}

function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field+='"'; i++; } else { inQuotes = false; }
      } else field += c;
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field=""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ /* пропускаємо */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function parseTimestamp(str){
  str = (str||"").trim();
  let d = new Date(str);
  if(!isNaN(d.getTime())) return d.getTime();
  const m = str.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})[,\s]+(\d{1,2}):(\d{2})(:(\d{2}))?/);
  if(m){
    const eu = str.indexOf('.') !== -1;
    let day, month;
    if(eu){ day=+m[1]; month=+m[2]; } else { month=+m[1]; day=+m[2]; }
    let year = +m[3]; if(year < 100) year += 2000;
    const hh=+m[4], mm=+m[5], ss = m[7]?+m[7]:0;
    d = new Date(year, month-1, day, hh, mm, ss);
    if(!isNaN(d.getTime())) return d.getTime();
  }
  return 0;
}

async function fetchAttempts(){
  const controller = new AbortController();
  const timeoutId = setTimeout(()=> controller.abort(), 8000); // не чекаємо довше 8 секунд
  let res;
  try{
    res = await fetch(CSV_URL + (CSV_URL.includes("?") ? "&" : "?") + "_ts=" + Date.now(), { cache: "no-store", signal: controller.signal });
  } finally {
    clearTimeout(timeoutId);
  }
  const text = await res.text();
  const rows = parseCSV(text);
  const out = [];
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r || r.length < 2 || !r[1]) continue;
    out.push({
      ts: parseTimestamp(r[0]),
      email: (r[1]||"").trim().toLowerCase(),
      callsign: (r[2]||"").trim(),
      posada: (r[3]||"").trim(),
      general: (r[4]||"").trim(),
      profile: (r[5]||"").trim(),
      situational: (r[6]||"").trim(),
      result: (r[7]||"").trim()
    });
  }
  return out;
}

    <div class="meta-line" style="text-align:center">Пошта: <b>${email}</b></div>
    <div class="meta-line" style="text-align:center">Позивний: <b>${callsign}</b></div>
    <p class="sub" style="margin-top:16px;text-align:center">Наступна спроба буде доступна через <b style="color:var(--text-primary)">${fmtRemaining(remainingMs)}</b>.</p>
    <button class="btn-ghost" id="backBtn">← Ввести інші дані</button>
  `;
  document.getElementById("backBtn").onclick = ()=> renderStart();
}

async function onStartClick(){
  const email = document.getElementById("email").value.trim().toLowerCase();
  const callsign = document.getElementById("callsign").value.trim();
  const posada = document.getElementById("posada").value;
  if(!email || !email.includes("@")){ renderStart("Вкажи коректну пошту."); return; }
  if(!callsign){ renderStart("Вкажи позивний."); return; }
  if(!posada){ renderStart("Обери посаду зі списку."); return; }
  state.email = email;
  state.callsign = callsign;
  state.posada = posada;

  const startBtn = document.getElementById("startBtn");
  startBtn.disabled = true;
  startBtn.textContent = "Перевірка…";

  try{
    if(!isAdminMode && email !== ADMIN_EMAIL){
      const attempts = await fetchAttempts();
      let last = null;
      attempts.forEach(a=>{ if(a.email === email && (!last || a.ts > last.ts)) last = a; });
      if(last && last.ts > 0){
        const elapsed = Date.now() - last.ts;
        if(elapsed < COOLDOWN_MS){
          renderCooldown(email, callsign, COOLDOWN_MS - elapsed, last);
          return;
        }
      }
    }
  }catch(e){
    renderStart("Не вдалося перевірити кулдаун (проблема з мережею чи посиланням на таблицю). Спробуй ще раз за хвилину.");
    return;
  }

  startQuiz();
}

/* ============================================================
   ТЕСТ
   ============================================================ */
function buildQuestion(raw){
  const optionOrder = shuffle(raw[1].map((text,i)=>({text,orig:i})));
  return {
    text: raw[0],
    options: optionOrder.map(o=>o.text),
    correctIndex: optionOrder.findIndex(o=>o.orig === raw[2]),
    situational: !!raw[3]
  };
}

function startQuiz(){
  const generalPicked = shuffle(GENERAL_POOL).slice(0, GENERAL_COUNT).map(q => Object.assign(buildQuestion(q), {section:"general"}));
  const profilePool = PROFILE_POOLS[state.posada] || [];
  const profilePicked = shuffle(profilePool).slice(0, PROFILE_COUNT).map(q => Object.assign(buildQuestion(q), {section:"profile"}));

  state.quiz = generalPicked.concat(profilePicked);
  state.current = 0;
  state.answers = new Array(state.quiz.length).fill(null);
  state.startTs = Date.now();
  state.finished = false;
  saveProgress();

  timerEl.classList.remove("hidden");
  startTimer();
  renderQuestion();
}

function tick(){
  const elapsed = Math.floor((Date.now() - state.startTs)/1000);
  state.timeLeft = TIME_LIMIT_SECONDS - elapsed;
  updateTimerDisplay();
  if(state.timeLeft <= 0){
    clearInterval(state.timerId);
    finishQuiz();
  }
}
function startTimer(){
  clearInterval(state.timerId);
  tick();
  state.timerId = setInterval(tick, 1000);
}
function updateTimerDisplay(){
  timerEl.textContent = fmtTime(Math.max(0,state.timeLeft));
  timerEl.classList.toggle("warn", state.timeLeft <= 60);
}

function renderQuestion(){
  const q = state.quiz[state.current];
  const isLast = state.current === state.quiz.length - 1;
  const sectionLabel = q.section === "general" ? "Загальна частина" : "Профільна частина — " + state.posada;
  card.innerHTML = `
    <div class="progress">${sectionLabel} · ПИТАННЯ ${state.current+1} / ${state.quiz.length}</div>
    <div class="qtext">${q.text}</div>
    <div class="options" id="opts"></div>
    <button class="btn-primary" id="nextBtn" disabled>${isLast ? "Завершити тест" : "Далі"}</button>
  `;
  const optsEl = document.getElementById("opts");
  q.options.forEach((opt, idx)=>{
    const row = document.createElement("label");
    row.className = "opt" + (isAdminMode && idx === q.correctIndex ? " correct-answer" : "");
    row.innerHTML = `<input type="radio" name="opt" value="${idx}"/><span>${opt}</span>${isAdminMode && idx === q.correctIndex ? ' <span style="color:var(--status-good-text);font-weight:700;margin-left:6px">✓</span>' : ''}`;
    row.onclick = ()=>{
      document.querySelectorAll(".opt").forEach(o=>o.classList.remove("selected"));
      row.classList.add("selected");
      document.getElementById("nextBtn").disabled = false;
      state._pendingChoice = idx;
    };
    optsEl.appendChild(row);
  });
  document.getElementById("nextBtn").onclick = ()=>{
    state.answers[state.current] = state._pendingChoice;
    state._pendingChoice = undefined;
    if(state.current < state.quiz.length - 1){
      state.current++;
      saveProgress();
      renderQuestion();
    } else {
      clearInterval(state.timerId);
      finishQuiz();
    }
  };
}

async function finishQuiz(){
  if(state.finished) return;
  state.finished = true;
  timerEl.classList.add("hidden");
  clearProgress();

  let generalCorrect = 0, generalTotal = 0;
  let profileCorrect = 0, profileTotal = 0;
  let situationalCorrect = 0, situationalTotal = 0;

  state.quiz.forEach((q,i)=>{
    const isRight = state.answers[i] === q.correctIndex;
    if(q.section === "general"){
      generalTotal++;
      if(isRight) generalCorrect++;
    } else {
      profileTotal++;
      if(isRight) profileCorrect++;
      if(q.situational){
        situationalTotal++;
        if(isRight) situationalCorrect++;
      }
    }
  });

  const generalErrors = generalTotal - generalCorrect;
  const profileErrors = profileTotal - profileCorrect;
  const passedGreen = generalErrors <= 1 && profileErrors <= 1;
  const passedYellow = generalErrors <= PASS_THRESHOLD_GENERAL_ERR && profileErrors <= PASS_THRESHOLD_PROFILE_ERR;
  const result = passedGreen ? "СКЛАВ" : (passedYellow ? "СКЛАВ ІЗ ЗАУВАЖЕННЯМИ" : "НЕ СКЛАВ");

  const payload = {
    [ENTRY_EMAIL]: state.email,
    [ENTRY_CALLSIGN]: state.callsign,
    [ENTRY_POSADA]: state.posada,
    [ENTRY_GENERAL]: generalCorrect + "/" + generalTotal,
    [ENTRY_PROFILE]: profileCorrect + "/" + profileTotal,
    [ENTRY_SITUATIONAL]: situationalCorrect + "/" + situationalTotal,
    [ENTRY_RESULT]: result
  };

  card.innerHTML = `
    <div class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><path d="M5 12l5 5L20 7"/></svg></div>
    <h1>Тест завершено</h1>
    <p class="sub">Зберігаємо відповіді…</p>
  `;

  try{
    await submitToGoogleForm(payload);
  }catch(e){ /* навіть якщо не вдалось — все одно показуємо результат */ }

  const badgeCls = resultBadgeClass(result);
  card.innerHTML = `
    <h1 style="text-align:center">${isAdminMode ? "Результат" : "Відповіді прийнято"}</h1>
    ${isAdminMode ? `
      <div class="result-badge ${badgeCls}">${result}</div>
      <div class="result-breakdown">
        <div><div class="num">${generalCorrect}/${generalTotal}</div><div class="lbl">Загальний</div></div>
        <div><div class="num">${profileCorrect}/${profileTotal}</div><div class="lbl">Профільний</div></div>
        <div><div class="num">${situationalCorrect}/${situationalTotal}</div><div class="lbl">Ситуаційні</div></div>
      </div>
    ` : `<p class="sub" style="text-align:center">Результат підлягає перевірці відповідальною особою.</p>`}
    <div class="meta-line" style="text-align:center">Пошта: <b>${state.email}</b></div>
    <div class="meta-line" style="text-align:center">Позивний: <b>${state.callsign}</b></div>
    <div class="meta-line" style="text-align:center">Посада: <b>${state.posada}</b></div>
    <button class="btn-primary" id="restartBtn" style="margin-top:18px">До початку</button>
  `;
  document.getElementById("restartBtn").onclick = ()=>{
    state = { email:"", callsign:"", posada:"", quiz:[], current:0, answers:[], timeLeft:TIME_LIMIT_SECONDS, timerId:null, finished:false, startTs:0 };
    renderStart();
  };
}

/* ============================================================
   СТАРТ: перевіряємо, чи є незавершений тест у цьому браузері
   ============================================================ */
function renderPasswordGate(errorMsg){
  timerEl.classList.add("hidden");
  card.innerHTML = `
    <div style="text-align:center">
      <div class="icon-circle" style="margin-left:auto;margin-right:auto">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10" width="16" height="10" rx="2"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>
      </div>
      <h1>Доступ обмежено</h1>
      <p class="sub">Введи код доступу, щоб відкрити тест</p>
    </div>
    <input type="password" id="pageCode" placeholder="Код доступу" autofocus style="text-align:center;letter-spacing:.08em;font-size:17px"/>
    ${errorMsg ? `<div class="error" style="text-align:center">${errorMsg}</div>` : ""}
    <button class="btn-primary" id="unlockBtn">Увійти</button>
  `;
  const submit = ()=>{
    const val = document.getElementById("pageCode").value;
    if(val === ADMIN_PASSWORD){
      try{ sessionStorage.setItem("sop_unlocked", "1"); sessionStorage.setItem("sop_admin", "1"); }catch(e){}
      isAdminMode = true;
      startApp();
    } else if(val === PAGE_PASSWORD){
      try{ sessionStorage.setItem("sop_unlocked", "1"); sessionStorage.removeItem("sop_admin"); }catch(e){}
      isAdminMode = false;
      startApp();
    } else {
      renderPasswordGate("Невірний код доступу.");
    }
  };
  document.getElementById("unlockBtn").onclick = submit;
  document.getElementById("pageCode").addEventListener("keydown", (e)=>{ if(e.key === "Enter") submit(); });
}

function startApp(){
  const saved = loadProgress();
  if(saved && saved.quiz && saved.quiz.length && saved.startTs){
    state.email = saved.email;
    state.callsign = saved.callsign;
    state.posada = saved.posada;
    state.quiz = saved.quiz;
    state.answers = saved.answers;
    state.current = saved.current;
    state.startTs = saved.startTs;
    state.finished = false;
    const elapsed = Date.now() - saved.startTs;
    timerEl.classList.remove("hidden");
    if(elapsed >= TIME_LIMIT_SECONDS * 1000){
      finishQuiz();
    } else {
      startTimer();
      renderQuestion();
    }
  } else {
    renderStart();
  }
}

let isAdminMode = false;

(function initGate(){
  let unlocked = false;
  try{
    unlocked = sessionStorage.getItem("sop_unlocked") === "1";
    isAdminMode = sessionStorage.getItem("sop_admin") === "1";
  }catch(e){}
  if(unlocked){ startApp(); } else { renderPasswordGate(); }
})();
</script>
